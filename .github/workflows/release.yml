name: Build & Release

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: '预发布版本'
        required: false
        default: false
        type: boolean

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 9.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Download game references
        run: |
          mkdir -p deps
          DEPS_URL="https://github.com/${{ github.repository }}/releases/download/0.107.1"
          curl -sL "${DEPS_URL}/sts2.dll" -o deps/sts2.dll
          curl -sL "${DEPS_URL}/0Harmony.dll" -o deps/0Harmony.dll
          ls -la deps/

      - name: Restore & Build all projects
        run: |
          dotnet restore STS2_ShunMod.sln
          dotnet build STS2_ShunMod.sln -c Release -p:Sts2DataDir="$(realpath deps)"

      - name: Export .pck (Shun only)
        run: |
          echo "=== Downloading Godot 4.5.1 Mono ==="
          GODOT_URL="https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_mono_linux_x86_64.zip"
          curl -sL "$GODOT_URL" -o godot.zip || { echo "Download failed"; exit 0; }
          unzip -q godot.zip -d godot 2>/dev/null
          GODOT=$(find godot -name "Godot*" -type f -executable | head -1)
          [ -z "$GODOT" ] && { echo "Godot not found"; exit 0; }
          chmod +x "$GODOT"
          echo "=== Exporting .pck ==="
          "$GODOT" --headless --export-pack "BasicExport" ShunMod_Shun.pck
          ls -la ShunMod_Shun.pck 2>/dev/null || echo "Export failed"

      - name: Package individual zips
        run: |
          for entry in "Core|ShunMod.Core" "Shun|ShunMod.Shun" "Tweaks|ShunMod.Tweaks" "Compat|ShunMod.Compat"; do
            PROJ="${entry%%|*}"
            DIR="${entry##*|}"
            ASM="ShunMod_${PROJ}"
            echo "=== Packaging ${ASM} ==="
            mkdir -p "publish/${ASM}"
            cp "${DIR}/.godot/mono/temp/bin/Release/${ASM}.dll" "publish/${ASM}/"
            cp "${DIR}/${ASM}.json" "publish/${ASM}/"
            PCK=$(find "${DIR}/.godot/mono/temp/bin/Release" -name "${ASM}.pck" -type f 2>/dev/null | head -1)
            if [ -z "$PCK" ]; then
              PCK=$(find . -maxdepth 1 -name "${ASM}.pck" -type f 2>/dev/null | head -1)
            fi
            if [ -n "$PCK" ]; then
              cp "$PCK" "publish/${ASM}/"
            fi
            ls -la "publish/${ASM}/"
            cd publish && zip -r "../${ASM}.zip" "${ASM}/" && cd ..
            echo "  Packaged: $(ls -lh ${ASM}.zip | awk '{print $5}')"
          done

      - name: Package full zip
        run: |
          mkdir -p publish
          for entry in "Core|ShunMod.Core" "Shun|ShunMod.Shun" "Tweaks|ShunMod.Tweaks" "Compat|ShunMod.Compat"; do
            PROJ="${entry%%|*}"
            DIR="${entry##*|}"
            ASM="ShunMod_${PROJ}"
            mkdir -p "publish/${ASM}"
            cp "${DIR}/.godot/mono/temp/bin/Release/${ASM}.dll" "publish/${ASM}/"
            cp "${DIR}/${ASM}.json" "publish/${ASM}/"
          done
          PCK=$(find "ShunMod.Shun/.godot/mono/temp/bin/Release" -name "ShunMod_Shun.pck" -type f 2>/dev/null | head -1)
          if [ -z "$PCK" ]; then
            PCK=$(find . -maxdepth 1 -name "ShunMod_Shun.pck" -type f 2>/dev/null | head -1)
          fi
          if [ -n "$PCK" ]; then
            cp "$PCK" "publish/ShunMod_Shun/"
          fi
          ls -la publish/
          cd publish && zip -r "../STS2_ShunMod.zip" . && cd ..
          echo "  Packaged: $(ls -lh STS2_ShunMod.zip | awk '{print $5}')"

      - name: Bump changed modules
        run: |
          python3 << 'PYEOF'
          import json, os, subprocess

          MODULES = [
              ('ShunMod.Core/ShunMod_Core.json', 'ShunMod.Core'),
              ('ShunMod.Shun/ShunMod_Shun.json', 'ShunMod.Shun'),
              ('ShunMod.Tweaks/ShunMod_Tweaks.json', 'ShunMod.Tweaks'),
              ('ShunMod.Compat/ShunMod_Compat.json', 'ShunMod.Compat'),
          ]

          prev = subprocess.run(
              ['git', 'describe', '--tags', '--abbrev=0', 'HEAD^'],
              capture_output=True, text=True
          ).stdout.strip() or None

          bumped = []
          for json_path, check_dir in MODULES:
              if prev:
                  r = subprocess.run(
                      ['git', 'diff', f'{prev}..HEAD', '--name-only', '--', f'{check_dir}/'],
                      capture_output=True, text=True
                  )
                  changed = bool(r.stdout.strip())
              else:
                  changed = True

              if changed:
                  with open(json_path) as f:
                      d = json.load(f)
                  parts = d['version'].lstrip('v').split('.')
                  new_v = f'v{parts[0]}.{parts[1]}.{int(parts[2]) + 1}'
                  print(f'  {json_path}: {d["version"]} -> {new_v}')
                  d['version'] = new_v
                  with open(json_path, 'w') as f:
                      json.dump(d, f, indent=2, ensure_ascii=False)
                  f.flush()
                  os.fsync(f.fileno())
                  subprocess.run(['git', 'add', json_path], check=True)
                  bumped.append(json_path)
              else:
                  print(f'  {json_path}: unchanged, skipped')

          if not bumped:
              print('No modules changed, nothing to bump.')
              exit(0)

          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', 'github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'commit', '-m', 'chore: bump module versions'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:main'], check=True)
          PYEOF

      - name: Get release tag
        id: ver
        run: |
          python3 << 'PYEOF'
          import json, os

          modules = [
              'ShunMod.Core/ShunMod_Core.json',
              'ShunMod.Shun/ShunMod_Shun.json',
              'ShunMod.Tweaks/ShunMod_Tweaks.json',
              'ShunMod.Compat/ShunMod_Compat.json',
          ]

          versions = []
          for path in modules:
              with open(path) as f:
                  d = json.load(f)
              versions.append(d['version'])

          highest = sorted(versions, key=lambda v: [int(x) for x in v.lstrip('v').split('.')])[-1]
          print(f'module versions: {versions}')
          print(f'release tag: {highest}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'TAG={highest}\n')
          PYEOF

      - name: Generate release notes
        run: |
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          TAG="${{ steps.ver.outputs.TAG }}"

          CORE_V=$(python3 -c "import json; print(json.load(open('ShunMod.Core/ShunMod_Core.json'))['version'])")
          SHUN_V=$(python3 -c "import json; print(json.load(open('ShunMod.Shun/ShunMod_Shun.json'))['version'])")
          TWEAKS_V=$(python3 -c "import json; print(json.load(open('ShunMod.Tweaks/ShunMod_Tweaks.json'))['version'])")
          COMPAT_V=$(python3 -c "import json; print(json.load(open('ShunMod.Compat/ShunMod_Compat.json'))['version'])")

          if [ -n "$PREV" ]; then
            LOG=$(git log ${PREV}..HEAD --pretty=format:"%s|||%h|||%H" --reverse | grep -v "^chore:")
          else
            LOG=$(git log --pretty=format:"%s|||%h|||%H" --reverse | grep -v "^chore:")
          fi

          FEATS=$(echo "$LOG" | grep "^feat" || true)
          FIXES=$(echo "$LOG" | grep "^fix" || true)
          REFACTORS=$(echo "$LOG" | grep "^refactor" || true)
          OTHERS=$(echo "$LOG" | grep -v "^feat\|^fix\|^refactor" || true)

          fmt() {
            echo "$1" | while IFS='|||' read -r msg hash full; do
              [ -z "$msg" ] && continue
              echo "- ${msg#feat: }${msg#fix: }${msg#refactor: } ([${hash}](https://github.com/${{ github.repository }}/commit/${full}))"
            done
          }

          {
            echo "# STS2-ShunMod ${TAG}"
            echo ""
            echo "## 安装"
            echo ""
            echo "下载 \`STS2_ShunMod.zip\`，解压到 \`Mods/\` 目录，包含 4 个模块："
            echo ""
            echo "| 模块 | 版本 | 文件夹 |"
            echo "|------|------|--------|"
            echo "| \`ShunMod_Core\` | ${CORE_V} | \`Mods/ShunMod_Core/\` |"
            echo "| \`ShunMod_Shun\` | ${SHUN_V} | \`Mods/ShunMod_Shun/\` |"
            echo "| \`ShunMod_Tweaks\` | ${TWEAKS_V} | \`Mods/ShunMod_Tweaks/\` |"
            echo "| \`ShunMod_Compat\` | ${COMPAT_V} | \`Mods/ShunMod_Compat/\` |"
            echo ""
            echo "---"
            echo ""
            echo "## 更新内容"
            echo ""
            if [ -n "$PREV" ]; then
              echo "> 自 \`$PREV\` 以来的更改"
              echo ""
            fi

            if [ -n "$FEATS" ]; then
              echo "### 新功能"
              fmt "$FEATS"
              echo ""
            fi
            if [ -n "$FIXES" ]; then
              echo "### 修复"
              fmt "$FIXES"
              echo ""
            fi
            if [ -n "$REFACTORS" ]; then
              echo "### 重构"
              fmt "$REFACTORS"
              echo ""
            fi
            if [ -n "$OTHERS" ]; then
              echo "### 其他"
              fmt "$OTHERS"
              echo ""
            fi
            echo ""
            echo "---"
            echo ""
            echo "各模块独立 Version：Core=${CORE_V} / Shun=${SHUN_V} / Tweaks=${TWEAKS_V} / Compat=${COMPAT_V}"
          } > release_notes.md

      - name: Upload to NexusMods
        continue-on-error: true
        uses: Nexus-Mods/upload-action@main
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_group_id: ${{ secrets.NEXUSMODS_FILE_GROUP_ID }}
          filename: STS2_ShunMod.zip
          changelog_file: release_notes.md
          version: ${{ steps.ver.outputs.TAG }}
          file_category: main

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.TAG }}
          files: |
            STS2_ShunMod.zip
            ShunMod_Core.zip
            ShunMod_Shun.zip
            ShunMod_Tweaks.zip
            ShunMod_Compat.zip
          body_path: release_notes.md
          prerelease: ${{ github.event.inputs.prerelease || false }}