name: Build & Release

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: '预发布版本'
        required: false
        default: false
        type: boolean

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version
        run: |
          CUR=$(python3 -c "import json; d=json.load(open('STS2-ShunMod.json')); print(d['version'])")
          MAJOR=$(echo "${CUR#v}" | cut -d. -f1)
          MINOR=$(echo "${CUR#v}" | cut -d. -f2)
          PATCH=$(echo "${CUR#v}" | cut -d. -f3)
          NEW=$((PATCH + 1))
          V="v${MAJOR}.${MINOR}.${NEW}"
          echo "${CUR} → ${V}"
          python3 -c "import json; d=json.load(open('STS2-ShunMod.json')); d['version']='${V}'; json.dump(d, open('STS2-ShunMod.json','w'), indent=2, ensure_ascii=False)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add STS2-ShunMod.json
          git commit -m "chore: bump to ${V}"
          git push origin HEAD:main

      - name: Setup .NET 9.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Download game references
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p deps
          gh release download deps \
            --dir deps \
            --pattern "*.dll" \
            --repo "${{ github.repository }}" \
            --clobber 2>/dev/null || {
            echo ""
            echo "=============================================="
            echo "  缺少 CI 构建依赖！请上传游戏 DLL 到 deps release："
            echo "    gh release create deps --title deps sts2.dll 0Harmony.dll"
            echo "=============================================="
            exit 1
          }
          ls -la deps/

      - name: Build & Export .pck
        run: |
          dotnet build STS2-ShunMod.csproj -c Release -p:Sts2DataDir="$(realpath deps)"
          echo "=== 下载 Godot 4.5.1 Mono ==="
          GODOT_URL="https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_mono_linux_x86_64.zip"
          curl -sL "$GODOT_URL" -o godot.zip || { echo "❌ 下载失败，回退到资源目录"; exit 0; }
          unzip -q godot.zip -d godot 2>/dev/null
          GODOT=$(find godot -name "Godot*" -type f -executable | head -1)
          [ -z "$GODOT" ] && { echo "❌ 未找到 Godot 可执行文件"; exit 0; }
          chmod +x "$GODOT"
          echo "=== 导出 .pck ==="
          "$GODOT" --headless --export-pack "BasicExport" STS2-ShunMod.pck
          ls -la STS2-ShunMod.pck 2>/dev/null || echo "⚠️ 导出失败"

      - name: Package
        run: |
          BUILD_DIR=.godot/mono/temp/bin/Release
          mkdir -p publish
          cp "$BUILD_DIR/STS2-ShunMod.dll" publish/
          cp STS2-ShunMod.json publish/
          PCK=$(find . -maxdepth 1 -name "STS2-ShunMod.pck" -type f 2>/dev/null | head -1)
          if [ -n "$PCK" ]; then
            cp "$PCK" publish/
          else
            echo "⚠️ 无 .pck"
          fi
          ls -la publish/
          cd publish && zip -r ../STS2-ShunMod.zip .

      - name: Get version
        id: ver
        run: |
          V=$(python3 -c "import json; d=json.load(open('STS2-ShunMod.json')); print(d['version'])")
          echo "version: $V"
          echo "TAG=$V" >> $GITHUB_OUTPUT

      - name: Generate release notes
        run: |
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          # 过滤掉版本号 bump 提交
          if [ -n "$PREV" ]; then
            LOG=$(git log ${PREV}..HEAD --pretty=format:"%s|||%h|||%H" --reverse | grep -v "^chore: bump to")
          else
            LOG=$(git log --pretty=format:"%s|||%h|||%H" --reverse | grep -v "^chore: bump to")
          fi

          # 按前缀分类
          FEATS=$(echo "$LOG" | grep "^feat" || true)
          FIXES=$(echo "$LOG" | grep "^fix" || true)
          REFACTORS=$(echo "$LOG" | grep "^refactor" || true)
          DOCS=$(echo "$LOG" | grep "^docs" || true)
          CHORES=$(echo "$LOG" | grep "^chore" || true)
          OTHERS=$(echo "$LOG" | grep -v "^feat\|^fix\|^refactor\|^docs\|^chore" || true)

          fmt() {
            echo "$1" | while IFS='|||' read -r msg hash full; do
              [ -z "$msg" ] && continue
              echo "- ${msg#feat: }${msg#fix: }${msg#refactor: }${msg#docs: }${msg#chore: } ([${hash}](https://github.com/${{ github.repository }}/commit/${full}))"
            done
          }

          {
            echo "## 🚀 安装"
            echo ""
            echo "下载 \`STS2-ShunMod.zip\`，解压到 \`Mods/STS2_ShunMod/\`，启动游戏。"
            echo ""
            echo "---"
            echo ""
            V=$(python3 -c "import json; d=json.load(open('STS2-ShunMod.json')); print(d['version'])")
            echo "## ⚠️ 已知问题"
            echo ""
            echo "- 无"
            echo ""
            echo "---"
            echo ""
            echo "## 更新内容"
            echo ""
            if [ -n "$PREV" ]; then
              echo "> 自 \`$PREV\` 以来的更改"
              echo ""
            fi

            if [ -n "$FEATS" ]; then
              echo "### ✨ 新功能"
              fmt "$FEATS"
              echo ""
            fi
            if [ -n "$FIXES" ]; then
              echo "### 🐛 修复"
              fmt "$FIXES"
              echo ""
            fi
            if [ -n "$REFACTORS" ]; then
              echo "### ♻️ 重构"
              fmt "$REFACTORS"
              echo ""
            fi
            if [ -n "$DOCS" ]; then
              echo "### 📝 文档"
              fmt "$DOCS"
              echo ""
            fi
            if [ -n "$CHORES" ]; then
              echo "### 🔧 杂项"
              fmt "$CHORES"
              echo ""
            fi
            if [ -n "$OTHERS" ]; then
              echo "### 📦 其他"
              fmt "$OTHERS"
              echo ""
            fi
          } > release_notes.md

      - name: Upload to NexusMods
        continue-on-error: true
        uses: Nexus-Mods/upload-action@main
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_group_id: ${{ secrets.NEXUSMODS_FILE_GROUP_ID }}
          filename: STS2-ShunMod.zip
          version: ${{ steps.ver.outputs.TAG }}
          file_category: main

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.TAG }}
          files: STS2-ShunMod.zip
          body_path: release_notes.md
          prerelease: ${{ github.event.inputs.prerelease || false }}
