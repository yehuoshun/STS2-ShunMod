name: Build & Release

on:
  push:
    branches: []
  workflow_dispatch:
    inputs:
      prerelease:
        description: '预发布版本'
        required: false
        default: false
        type: boolean
      tag_override:
        description: '手动指定 tag（留空则自动取最高模块版本）'
        required: false
        default: ''
        type: string

concurrency:
  group: ${{ github.workflow }}-release
  cancel-in-progress: true

jobs:
  # ── 先构建 Core（其他模块依赖 Core） ────────────────────────────────────
  build-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 9.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Download game references
        run: |
          mkdir -p deps
          DEPS_URL="https://github.com/${{ github.repository }}/releases/download/0.107.1"
          curl -sL "${DEPS_URL}/sts2.dll" -o deps/sts2.dll
          curl -sL "${DEPS_URL}/0Harmony.dll" -o deps/0Harmony.dll

      - name: Restore
        run: dotnet restore STS2_ShunMod.sln

      - name: Build Core
        run: |
          dotnet build ShunMod.Core/ShunMod.Core.csproj -c Release -p:Sts2DataDir="$(realpath deps)" --no-restore

      - name: Upload Core artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-core
          path: |
            ShunMod.Core/.godot/mono/temp/bin/Release/ShunMod_Core.dll
            ShunMod.Core/ShunMod_Core.json
          retention-days: 1

  # ── 剩余模块并行构建 ────────────────────────────────────────────────────
  build-modules:
    needs: build-core
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module:
          - name: Shun
            proj: ShunMod.Shun/ShunMod.Shun.csproj
            dir: ShunMod.Shun
            asm: ShunMod_Shun
            has_pck: true
          - name: Tweaks
            proj: ShunMod.Tweaks/ShunMod.Tweaks.csproj
            dir: ShunMod.Tweaks
            asm: ShunMod_Tweaks
            has_pck: false
          - name: Compat
            proj: ShunMod.Compat/ShunMod.Compat.csproj
            dir: ShunMod.Compat
            asm: ShunMod_Compat
            has_pck: false
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 9.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Download game references
        run: |
          mkdir -p deps
          DEPS_URL="https://github.com/${{ github.repository }}/releases/download/0.107.1"
          curl -sL "${DEPS_URL}/sts2.dll" -o deps/sts2.dll
          curl -sL "${DEPS_URL}/0Harmony.dll" -o deps/0Harmony.dll

      - name: Download Core artifact
        uses: actions/download-artifact@v4
        with:
          name: build-core
          path: ${{ matrix.module.dir }}/.godot/mono/temp/bin/Release/

      - name: Restore
        run: dotnet restore STS2_ShunMod.sln

      - name: Build ${{ matrix.module.name }}
        run: |
          dotnet build ${{ matrix.module.proj }} -c Release -p:Sts2DataDir="$(realpath deps)" --no-restore

      - name: Export .pck (${{ matrix.module.name }})
        if: ${{ matrix.module.has_pck }}
        run: |
          GODOT_URL="https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_mono_linux_x86_64.zip"
          curl -sL "$GODOT_URL" -o godot.zip
          unzip -q godot.zip -d godot 2>/dev/null
          GODOT=$(find godot -name "Godot*" -type f -executable | head -1)
          [ -z "$GODOT" ] && { echo "Godot not found"; exit 0; }
          chmod +x "$GODOT"
          "$GODOT" --headless --export-pack "BasicExport" ${{ matrix.module.asm }}.pck
          ls -la ${{ matrix.module.asm }}.pck 2>/dev/null || echo "Export failed"

      - name: Package ${{ matrix.module.name }} zip
        run: |
          ASM=${{ matrix.module.asm }}
          DIR=${{ matrix.module.dir }}
          mkdir -p "publish/${ASM}"
          cp "${DIR}/.godot/mono/temp/bin/Release/${ASM}.dll" "publish/${ASM}/"
          cp "${DIR}/${ASM}.json" "publish/${ASM}/"
          PCK=$(find . -maxdepth 1 -name "${ASM}.pck" -type f 2>/dev/null | head -1)
          if [ -n "$PCK" ]; then
            cp "$PCK" "publish/${ASM}/"
          fi
          cd publish && zip -r "../${ASM}.zip" "${ASM}/" && cd ..
          echo "  Packaged: $(ls -lh ${ASM}.zip | awk '{print $5}')"

      - name: Upload ${{ matrix.module.name }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.module.name }}
          path: ${{ matrix.module.asm }}.zip
          retention-days: 1

  # ── 汇总 + Release ──────────────────────────────────────────────────────
  release:
    needs: [build-core, build-modules]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: build-*
          merge-multiple: true

      - name: Package full zip
        run: |
          mkdir -p publish
          for entry in "Core|ShunMod.Core" "Shun|ShunMod.Shun" "Tweaks|ShunMod.Tweaks" "Compat|ShunMod.Compat"; do
            PROJ="${entry%%|*}"
            DIR="${entry##*|}"
            ASM="ShunMod_${PROJ}"
            mkdir -p "publish/${ASM}"
            cp "artifacts/${ASM}.dll" "publish/${ASM}/" 2>/dev/null || true
            cp "artifacts/${ASM}.json" "publish/${ASM}/" 2>/dev/null || true
            PCK=$(find artifacts -name "${ASM}.pck" -type f 2>/dev/null | head -1)
            if [ -n "$PCK" ]; then
              cp "$PCK" "publish/${ASM}/"
            fi
          done
          cd publish && zip -r "../STS2_ShunMod.zip" . && cd ..

      - name: Get release tag
        id: ver
        run: |
          TAG_OVERRIDE="${{ github.event.inputs.tag_override }}"
          if [ -n "$TAG_OVERRIDE" ]; then
            echo "TAG=${TAG_OVERRIDE}" >> $GITHUB_OUTPUT
            exit 0
          fi
          python3 << 'PYEOF'
          import json, os
          modules = [
              'ShunMod.Core/ShunMod_Core.json',
              'ShunMod.Shun/ShunMod_Shun.json',
              'ShunMod.Tweaks/ShunMod_Tweaks.json',
              'ShunMod.Compat/ShunMod_Compat.json',
          ]
          versions = []
          for path in modules:
              with open(path) as f:
                  d = json.load(f)
              versions.append(d['version'])
          highest = sorted(versions, key=lambda v: [int(x) for x in v.lstrip('v').split('.')])[-1]
          print(f'module versions: {versions}')
          print(f'release tag: {highest}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'TAG={highest}\n')
          PYEOF

      - name: Generate release notes
        run: |
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          TAG="${{ steps.ver.outputs.TAG }}"

          CORE_V=$(python3 -c "import json; print(json.load(open('ShunMod.Core/ShunMod_Core.json'))['version'])")
          SHUN_V=$(python3 -c "import json; print(json.load(open('ShunMod.Shun/ShunMod_Shun.json'))['version'])")
          TWEAKS_V=$(python3 -c "import json; print(json.load(open('ShunMod.Tweaks/ShunMod_Tweaks.json'))['version'])")
          COMPAT_V=$(python3 -c "import json; print(json.load(open('ShunMod.Compat/ShunMod_Compat.json'))['version'])")

          if [ -n "$PREV" ]; then
            LOG=$(git log ${PREV}..HEAD --pretty=format:"%s|||%h|||%H" --reverse | grep -v "^chore:")
          else
            LOG=$(git log --pretty=format:"%s|||%h|||%H" --reverse | grep -v "^chore:")
          fi

          FEATS=$(echo "$LOG" | grep "^feat" || true)
          FIXES=$(echo "$LOG" | grep "^fix" || true)
          REFACTORS=$(echo "$LOG" | grep "^refactor" || true)
          OTHERS=$(echo "$LOG" | grep -v "^feat\|^fix\|^refactor" || true)

          fmt() {
            echo "$1" | while IFS='|||' read -r msg hash full; do
              [ -z "$msg" ] && continue
              echo "- ${msg#feat: }${msg#fix: }${msg#refactor: } ([${hash}](https://github.com/${{ github.repository }}/commit/${full}))"
            done
          }

          {
            echo "# STS2-ShunMod ${TAG}"
            echo ""
            echo "## 安装"
            echo ""
            echo "下载 \`STS2_ShunMod.zip\`，解压到 \`Mods/\` 目录，包含 4 个模块："
            echo ""
            echo "| 模块 | 版本 | 文件夹 |"
            echo "|------|------|--------|"
            echo "| \`ShunMod_Core\` | ${CORE_V} | \`Mods/ShunMod_Core/\` |"
            echo "| \`ShunMod_Shun\` | ${SHUN_V} | \`Mods/ShunMod_Shun/\` |"
            echo "| \`ShunMod_Tweaks\` | ${TWEAKS_V} | \`Mods/ShunMod_Tweaks/\` |"
            echo "| \`ShunMod_Compat\` | ${COMPAT_V} | \`Mods/ShunMod_Compat/\` |"
            echo ""
            echo "---"
            echo ""
            echo "## 更新内容"
            echo ""
            if [ -n "$PREV" ]; then
              echo "> 自 \`$PREV\` 以来的更改"
              echo ""
            fi
            if [ -n "$FEATS" ]; then
              echo "### 新功能"
              fmt "$FEATS"
              echo ""
            fi
            if [ -n "$FIXES" ]; then
              echo "### 修复"
              fmt "$FIXES"
              echo ""
            fi
            if [ -n "$REFACTORS" ]; then
              echo "### 重构"
              fmt "$REFACTORS"
              echo ""
            fi
            if [ -n "$OTHERS" ]; then
              echo "### 其他"
              fmt "$OTHERS"
              echo ""
            fi
            echo ""
            echo "---"
            echo ""
            echo "各模块独立 Version：Core=${CORE_V} / Shun=${SHUN_V} / Tweaks=${TWEAKS_V} / Compat=${COMPAT_V}"
          } > release_notes.md

      - name: Upload to NexusMods
        continue-on-error: true
        uses: Nexus-Mods/upload-action@main
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_group_id: ${{ secrets.NEXUSMODS_FILE_GROUP_ID }}
          filename: STS2_ShunMod.zip
          changelog_file: release_notes.md
          version: ${{ steps.ver.outputs.TAG }}
          file_category: main

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.TAG }}
          files: |
            STS2_ShunMod.zip
            ShunMod_Core.zip
            ShunMod_Shun.zip
            ShunMod_Tweaks.zip
            ShunMod_Compat.zip
          body_path: release_notes.md
          prerelease: ${{ github.event.inputs.prerelease || false }}