name: Build & Release

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: '预发布版本'
        required: false
        default: false
        type: boolean

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version in all JSON
        run: |
          python3 -c "
import json, os

# 读取 Core 的版本号作为主版本
with open('ShunMod.Core/ShunMod_Core.json') as f:
    cur = json.load(f)['version']

maj, min, pat = cur.lstrip('v').split('.')
new = 'v' + maj + '.' + min + '.' + str(int(pat) + 1)
print(f'{cur} \u2192 {new}')

files = [
    'ShunMod.Core/ShunMod_Core.json',
    'ShunMod.Shun/ShunMod_Shun.json',
    'ShunMod.Tweaks/ShunMod_Tweaks.json',
    'ShunMod.Compat/ShunMod_Compat.json',
]
for f in files:
    d = json.load(open(f))
    d['version'] = new
    json.dump(d, open(f, 'w'), indent=2, ensure_ascii=False)
    print(f'  Updated: {f}')
"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ShunMod.*/ShunMod_*.json
          git commit -m "chore: bump to $(python3 -c "import json; print(json.load(open('ShunMod.Core/ShunMod_Core.json'))['version'])")"
          git push origin HEAD:main

      - name: Setup .NET 9.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Download game references
        run: |
          mkdir -p deps
          DEPS_URL="https://github.com/${{ github.repository }}/releases/download/0.107.1"
          curl -sL "${DEPS_URL}/sts2.dll" -o deps/sts2.dll
          curl -sL "${DEPS_URL}/0Harmony.dll" -o deps/0Harmony.dll
          ls -la deps/

      - name: Restore & Build all projects
        run: |
          dotnet restore STS2-ShunMod.sln
          dotnet build STS2-ShunMod.sln -c Release -p:Sts2DataDir="$(realpath deps)"

      - name: Package individual zips
        run: |
          BUILD_DIR=.godot/mono/temp/bin/Release
          for proj in Core Shun Tweaks Compat; do
            ASM="ShunMod_${proj}"
            echo "=== Packaging ${ASM} ==="
            mkdir -p "publish/${ASM}"
            cp "$BUILD_DIR/${ASM}.dll" "publish/${ASM}/"
            cp "${ASM}/${ASM}.json" "publish/${ASM}/"
            PCK=$(find . -maxdepth 1 -name "${ASM}.pck" -type f 2>/dev/null | head -1)
            if [ -z "$PCK" ]; then
              PCK=$(find "$BUILD_DIR" -name "${ASM}.pck" -type f 2>/dev/null | head -1)
            fi
            if [ -n "$PCK" ]; then
              cp "$PCK" "publish/${ASM}/"
            fi
            ls -la "publish/${ASM}/"
            cd publish && zip -r "../${ASM}.zip" "${ASM}/" && cd ..
            echo "  Packaged: $(ls -lh ${ASM}.zip | awk '{print $5}')"
          done

      - name: Package full zip
        run: |
          BUILD_DIR=.godot/mono/temp/bin/Release
          mkdir -p publish
          for proj in Core Shun Tweaks Compat; do
            ASM="ShunMod_${proj}"
            mkdir -p "publish/${ASM}"
            cp "$BUILD_DIR/${ASM}.dll" "publish/${ASM}/"
            cp "${ASM}/${ASM}.json" "publish/${ASM}/"
          done
          # Shun 的 pck
          PCK=$(find . -maxdepth 1 -name "ShunMod_Shun.pck" -type f 2>/dev/null | head -1)
          if [ -z "$PCK" ]; then
            PCK=$(find "$BUILD_DIR" -name "ShunMod_Shun.pck" -type f 2>/dev/null | head -1)
          fi
          if [ -n "$PCK" ]; then
            cp "$PCK" "publish/ShunMod_Shun/"
          fi
          ls -la publish/
          cd publish && zip -r "../STS2_ShunMod.zip" . && cd ..
          echo "  Packaged: $(ls -lh STS2_ShunMod.zip | awk '{print $5}')"

      - name: Get version
        id: ver
        run: |
          V=$(python3 -c "import json; d=json.load(open('ShunMod.Core/ShunMod_Core.json')); print(d['version'])")
          echo "version: $V"
          echo "TAG=$V" >> $GITHUB_OUTPUT

      - name: Generate release notes
        run: |
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -n "$PREV" ]; then
            LOG=$(git log ${PREV}..HEAD --pretty=format:"%s|||%h|||%H" --reverse | grep -v "^chore: bump to")
          else
            LOG=$(git log --pretty=format:"%s|||%h|||%H" --reverse | grep -v "^chore: bump to")
          fi

          FEATS=$(echo "$LOG" | grep "^feat" || true)
          FIXES=$(echo "$LOG" | grep "^fix" || true)
          REFACTORS=$(echo "$LOG" | grep "^refactor" || true)
          DOCS=$(echo "$LOG" | grep "^docs" || true)
          CHORES=$(echo "$LOG" | grep "^chore" || true)
          OTHERS=$(echo "$LOG" | grep -v "^feat\|^fix\|^refactor\|^docs\|^chore" || true)

          fmt() {
            echo "$1" | while IFS='|||' read -r msg hash full; do
              [ -z "$msg" ] && continue
              echo "- ${msg#feat: }${msg#fix: }${msg#refactor: }${msg#docs: }${msg#chore: } ([${hash}](https://github.com/${{ github.repository }}/commit/${full}))"
            done
          }

          {
            echo "## \u{1F680} 安装"
            echo ""
            echo "下载 \`STS2_ShunMod.zip\`，解压到 \`Mods/\`，包含 4 个模块："
            echo ""
            echo "| 模块 | 文件夹 | 说明 |"
            echo "|------|--------|------|"
            echo "| \`ShunMod_Core\` | \`Mods/ShunMod_Core/\` | 共享基础框架（必需） |"
            echo "| \`ShunMod_Shun\` | \`Mods/ShunMod_Shun/\` | 舜角色内容（卡牌/遗物/事件） |"
            echo "| \`ShunMod_Tweaks\` | \`Mods/ShunMod_Tweaks/\` | 数值/机制修改 |"
            echo "| \`ShunMod_Compat\` | \`Mods/ShunMod_Compat/\` | 第三方模组兼容补丁 |"
            echo ""
            echo "> 也可以单独下载各模块的独立 zip（ShunMod_Core.zip / ShunMod_Shun.zip / ShunMod_Tweaks.zip / ShunMod_Compat.zip）"
            echo ""
            echo "---"
            echo ""
            V=$(python3 -c "import json; d=json.load(open('ShunMod.Core/ShunMod_Core.json')); print(d['version'])")
            echo "## \u{26A0}\u{FE0F} 已知问题"
            echo ""
            echo "- 无"
            echo ""
            echo "---"
            echo ""

            echo "## 更新内容"
            echo ""
            if [ -n "$PREV" ]; then
              echo "> 自 \`$PREV\` 以来的更改"
              echo ""
            fi

            if [ -n "$FEATS" ]; then
              echo "### \u{2728} 新功能"
              fmt "$FEATS"
              echo ""
            fi
            if [ -n "$FIXES" ]; then
              echo "### \u{1F41B} 修复"
              fmt "$FIXES"
              echo ""
            fi
            if [ -n "$REFACTORS" ]; then
              echo "### \u{267B}\u{FE0F} 重构"
              fmt "$REFACTORS"
              echo ""
            fi
            if [ -n "$DOCS" ]; then
              echo "### \u{1F4DD} 文档"
              fmt "$DOCS"
              echo ""
            fi
            if [ -n "$CHORES" ]; then
              echo "### \u{1F527} 杂项"
              fmt "$CHORES"
              echo ""
            fi
            if [ -n "$OTHERS" ]; then
              echo "### \u{1F4E6} 其他"
              fmt "$OTHERS"
              echo ""
            fi
          } > release_notes.md

      - name: Upload to NexusMods
        continue-on-error: true
        uses: Nexus-Mods/upload-action@main
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_group_id: ${{ secrets.NEXUSMODS_FILE_GROUP_ID }}
          filename: STS2_ShunMod.zip
          changelog_file: release_notes.md
          version: ${{ steps.ver.outputs.TAG }}
          file_category: main

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.TAG }}
          files: |
            STS2_ShunMod.zip
            ShunMod_Core.zip
            ShunMod_Shun.zip
            ShunMod_Tweaks.zip
            ShunMod_Compat.zip
          body_path: release_notes.md
          prerelease: ${{ github.event.inputs.prerelease || false }}