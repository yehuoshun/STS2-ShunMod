name: Auto Tag

on:
  push:
    branches: [main]
    paths-ignore:
      # 避免 bump 版本号时触发无限循环
      - 'STS2-ShunMod.json'

jobs:
  auto-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto bump & tag
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('STS2-ShunMod.json'))['version'])")
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          V_NUM="${VERSION#v}"
          MAJOR=$(echo "$V_NUM" | cut -d. -f1)
          MINOR=$(echo "$V_NUM" | cut -d. -f2)
          PATCH=$(echo "$V_NUM" | cut -d. -f3)

          if [ -z "$LATEST_TAG" ]; then
            echo "🏷️ 首次打标: $VERSION"
            git tag "$VERSION"
            git push origin "$VERSION"
          elif [ "$LATEST_TAG" = "$VERSION" ]; then
            NEW_PATCH=$((PATCH + 1))
            NEW_VERSION="v${MAJOR}.${MINOR}.${NEW_PATCH}"
            echo "⬆️ Bump: $VERSION → $NEW_VERSION"

            python3 -c "
import json
d = json.load(open('STS2-ShunMod.json'))
d['version'] = '$NEW_VERSION'
json.dump(d, open('STS2-ShunMod.json', 'w'), indent=2, ensure_ascii=False)
print(json.dumps(d, indent=2, ensure_ascii=False))
"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add STS2-ShunMod.json
            git commit -m "chore: bump $VERSION → $NEW_VERSION [skip ci]"
            git tag "$NEW_VERSION"
            git push origin main --tags
          elif [ "$LATEST_TAG" != "$VERSION" ]; then
            echo "🏷️ JSON 版本高于最新 tag，打标: $VERSION"
            git tag "$VERSION"
            git push origin "$VERSION"
          else
            echo "✅ 无需操作"
          fi
