name: CI Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Download game references
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p deps
          gh release download deps \
            --dir deps \
            --pattern "*.dll" \
            --repo "${{ github.repository }}" \
            --clobber 2>/dev/null || \
            echo "⚠️ 缺少游戏 DLL，CI 跳过编译验证"

      - name: Restore
        run: dotnet restore STS2-ShunMod.csproj

      - name: Build
        id: build
        if: hashFiles('deps/sts2.dll') != ''
        run: dotnet build STS2-ShunMod.csproj -c Release -p:Sts2DataDir="$(realpath deps)" --no-restore

      - name: Package
        if: steps.build.outcome == 'success'
        run: |
          BUILD_DIR=.godot/mono/temp/bin/Release
          mkdir -p publish
          cp "$BUILD_DIR/STS2-ShunMod.dll" publish/ 2>/dev/null || echo "⚠️ 缺少 DLL"
          cp STS2-ShunMod.json publish/ 2>/dev/null || echo "⚠️ 缺少 json"
          if [ -d STS2_ShunMod/localization ]; then
            mkdir -p publish/STS2_ShunMod/localization
            cp -r STS2_ShunMod/localization/* publish/STS2_ShunMod/localization/
          fi
          cd publish && zip -r ../STS2-ShunMod.zip .

      - name: Upload artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: STS2-ShunMod
          path: STS2-ShunMod.zip

  auto-tag:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto bump and tag
        run: |
          MSG=$(git log -1 --pretty=%B)
          case "$MSG" in
            "chore: bump"*) echo "bump commit, skipping auto-tag"; exit 0 ;;
          esac

          VERSION=$(python3 -c "import json; print(json.load(open('STS2-ShunMod.json'))['version'])")
          LATEST_TAG=$(git tag --sort=-v:refname | head -1)

          if [ -z "$LATEST_TAG" ]; then
            echo "first tag: $VERSION"
            git tag "$VERSION"
            git push origin "$VERSION"
            exit 0
          fi

          if [ "$LATEST_TAG" != "$VERSION" ]; then
            echo "sync: json=$VERSION => tag=$LATEST_TAG"
            python3 -c "
import json
d = json.load(open('STS2-ShunMod.json'))
d['version'] = '$LATEST_TAG'
json.dump(d, open('STS2-ShunMod.json', 'w'), indent=2, ensure_ascii=False)
"
            VERSION="$LATEST_TAG"
          fi

          V_NUM="${VERSION#v}"
          MAJOR=$(echo "$V_NUM" | cut -d. -f1)
          MINOR=$(echo "$V_NUM" | cut -d. -f2)
          PATCH=$(echo "$V_NUM" | cut -d. -f3)
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="v${MAJOR}.${MINOR}.${NEW_PATCH}"
          echo "bump: $VERSION => $NEW_VERSION"

          python3 -c "
import json
d = json.load(open('STS2-ShunMod.json'))
d['version'] = '$NEW_VERSION'
json.dump(d, open('STS2-ShunMod.json', 'w'), indent=2, ensure_ascii=False)
"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add STS2-ShunMod.json
          git commit -m "chore: bump $VERSION => $NEW_VERSION"
          git tag "$NEW_VERSION"
          git push origin main --tags
          echo "Triggering release workflow for $NEW_VERSION via API..."
          HTTP_CODE=$(curl -sS -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/release.yml/dispatches" \
            -d "{\"ref\":\"main\",\"inputs\":{\"version\":\"$NEW_VERSION\"}}" \
            -o /dev/null -w "%{http_code}")
          if [ "$HTTP_CODE" = "204" ]; then
            echo "✅ Release workflow triggered (HTTP $HTTP_CODE)"
          else
            echo "❌ Failed to trigger release workflow (HTTP $HTTP_CODE)"
            exit 1
          fi
