name: CI Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DEPS_VERSION: "0.107.1"
  GODOT_VERSION: "4.5.1-stable"

jobs:
  # ── 单 job 全流程：省掉 3 段流水线的重复环境开销（5 台 VM → 1 台） ──
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup .NET 9.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Cache game references
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: deps
          key: deps-${{ env.DEPS_VERSION }}

      - name: Download game references
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          mkdir -p deps
          DEPS_URL="https://github.com/${{ github.repository }}/releases/download/${{ env.DEPS_VERSION }}"
          curl -sL "${DEPS_URL}/sts2.dll" -o deps/sts2.dll
          curl -sL "${DEPS_URL}/0Harmony.dll" -o deps/0Harmony.dll
          ls -la deps/

      - name: Check deps
        run: |
          if [ ! -f deps/sts2.dll ]; then
            echo ""
            echo "=============================================="
            echo "  sts2.dll not found in ${{ env.DEPS_VERSION }} release!"
            echo "  Upload with: gh release upload ${{ env.DEPS_VERSION }} sts2.dll 0Harmony.dll"
            echo "=============================================="
            exit 1
          fi

      - name: Restore
        run: dotnet restore STS2_ShunMod.sln

      # ── 一次构建整个 sln：MSBuild 自行调度（Core 先行，其余模块并行） ──
      - name: Build all modules
        run: |
          dotnet build STS2_ShunMod.sln \
            -c Release \
            -m \
            -p:Sts2DataDir="$(realpath deps)" \
            --no-restore

      # ── Godot .pck 导出（Shun 模块资源） ──
      - name: Cache Godot binary
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: godot-bin
          key: godot-${{ env.GODOT_VERSION }}

      - name: Download Godot for .pck export
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          echo "=== Downloading Godot ${{ env.GODOT_VERSION }} Mono ==="
          GODOT_URL="https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_mono_linux_x86_64.zip"
          curl -sL "$GODOT_URL" -o godot.zip || { echo "Download failed"; exit 0; }
          unzip -q godot.zip -d godot-bin 2>/dev/null
          ls -la godot-bin/

      - name: Export .pck
        run: |
          GODOT=$(find godot-bin -name "Godot*" -type f -executable | head -1)
          [ -z "$GODOT" ] && { echo "Godot not found, skipping .pck export"; exit 0; }
          chmod +x "$GODOT"
          echo "=== Exporting .pck ==="
          "$GODOT" --headless --export-pack "BasicExport" ShunMod_Shun.pck
          ls -la ShunMod_Shun.pck 2>/dev/null || echo "Export failed"

      # ── 汇总打包 ──
      - name: Package individual zips
        run: |
          for entry in "Core|ShunMod_Core" "Shun|ShunMod_Shun" "Tweaks|ShunMod_Tweaks" "Compat|ShunMod_Compat"; do
            NAME="${entry%%|*}"
            ASM="${entry##*|}"
            echo "=== Packaging ${ASM} ==="
            mkdir -p "publish/${ASM}"
            cp "ShunMod.${NAME}/.godot/mono/temp/bin/Release/${ASM}.dll" "publish/${ASM}/" 2>/dev/null || echo "  No dll found for ${ASM}"
            cp "ShunMod.${NAME}/${ASM}.json" "publish/${ASM}/" 2>/dev/null || echo "  No json found for ${ASM}"
            PCK=$(find . -maxdepth 1 -name "ShunMod_Shun.pck" -type f 2>/dev/null | head -1)
            if [ -n "$PCK" ] && [ "$ASM" = "ShunMod_Shun" ]; then
              cp "$PCK" "publish/${ASM}/"
            fi
            ls -la "publish/${ASM}/"
            cd publish && zip -r "../${ASM}.zip" "${ASM}/" && cd ..
            echo "  Packaged: $(ls -lh ${ASM}.zip | awk '{print $5}')"
          done

      - name: Package full zip
        run: |
          mkdir -p publish
          for asm in ShunMod_Core ShunMod_Shun ShunMod_Tweaks ShunMod_Compat; do
            mkdir -p "publish/${asm}"
            case "$asm" in
              ShunMod_Core)    DIR="ShunMod.Core";;
              ShunMod_Shun)    DIR="ShunMod.Shun";;
              ShunMod_Tweaks)  DIR="ShunMod.Tweaks";;
              ShunMod_Compat)  DIR="ShunMod.Compat";;
            esac
            cp "$DIR/.godot/mono/temp/bin/Release/${asm}.dll" "publish/${asm}/" 2>/dev/null || true
            cp "$DIR/${asm}.json" "publish/${asm}/" 2>/dev/null || true
          done
          PCK=$(find . -maxdepth 1 -name "ShunMod_Shun.pck" -type f 2>/dev/null | head -1)
          if [ -n "$PCK" ]; then
            cp "$PCK" "publish/ShunMod_Shun/"
          fi
          ls -la publish/
          cd publish && zip -r "../STS2_ShunMod.zip" . && cd ..
          echo "  Packaged: $(ls -lh STS2_ShunMod.zip | awk '{print $5}')"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ShunMod-Build
          path: |
            ShunMod_Core.zip
            ShunMod_Shun.zip
            ShunMod_Tweaks.zip
            ShunMod_Compat.zip
            STS2_ShunMod.zip
          if-no-files-found: error
