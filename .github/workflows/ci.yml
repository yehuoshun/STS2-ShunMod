name: CI Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Auto-bump version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          MSG=$(git log -1 --pretty=%B)
          if echo "$MSG" | grep -q "^chore: bump to"; then
            echo "⏭️ 跳过（bump 提交本身不触发再次 bump）"
            exit 0
          fi
          CUR=$(python3 -c "import json; d=json.load(open('STS2-ShunMod.json')); print(d['version'])")
          MAJOR=$(echo "${CUR#v}" | cut -d. -f1)
          MINOR=$(echo "${CUR#v}" | cut -d. -f2)
          PATCH=$(echo "${CUR#v}" | cut -d. -f3)
          NEW=$((PATCH + 1))
          V="v${MAJOR}.${MINOR}.${NEW}"
          python3 -c "import json; d=json.load(open('STS2-ShunMod.json')); d['version']='${V}'; json.dump(d, open('STS2-ShunMod.json','w'), indent=2, ensure_ascii=False)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add STS2-ShunMod.json
          git commit -m "chore: bump to ${V}" || echo "no changes"
          git push origin HEAD:main

      - name: Setup .NET 9.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Download game references
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p deps
          gh release download 0.99 \
            --dir deps \
            --pattern "*.dll" \
            --repo "${{ github.repository }}" \
            --clobber 2>/dev/null

      - name: Check deps
        run: |
          if [ ! -f deps/sts2.dll ]; then
            echo ""
            echo "=============================================="
            echo "  0.99 release 不存在或缺少 sts2.dll！"
            echo "  请上传游戏 DLL 到 0.99 release："
            echo "    gh release create 0.99 --title 0.99 sts2.dll 0Harmony.dll"
            echo "=============================================="
            exit 1
          fi

      - name: Restore
        run: dotnet restore STS2-ShunMod.csproj

      - name: Build DLL
        run: dotnet build STS2-ShunMod.csproj -c Release -p:Sts2DataDir="$(realpath deps)" --no-restore

      - name: Export .pck
        run: |
          echo "=== 下载 Godot 4.5.1 Mono ==="
          GODOT_URL="https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_mono_linux_x86_64.zip"
          curl -sL "$GODOT_URL" -o godot.zip || { echo "❌ 下载失败"; exit 0; }
          unzip -q godot.zip -d godot 2>/dev/null
          GODOT=$(find godot -name "Godot*" -type f -executable | head -1)
          [ -z "$GODOT" ] && { echo "❌ 未找到 Godot"; exit 0; }
          chmod +x "$GODOT"
          echo "=== 导出 .pck ==="
          "$GODOT" --headless --export-pack "BasicExport" STS2-ShunMod.pck
          ls -la STS2-ShunMod.pck 2>/dev/null || echo "⚠️ 导出失败"

      - name: Package
        run: |
          BUILD_DIR=.godot/mono/temp/bin/Release
          mkdir -p publish
          cp "$BUILD_DIR/STS2-ShunMod.dll" publish/
          cp STS2-ShunMod.json publish/
          PCK=$(find . -maxdepth 1 -name "STS2-ShunMod.pck" -type f 2>/dev/null | head -1)
          if [ -n "$PCK" ]; then
            cp "$PCK" publish/
          else
            echo "⚠️ 无 .pck"
          fi
          ls -la publish/
          cd publish && zip -r ../STS2-ShunMod.zip .
          echo "✅ 打包完成: $(ls -lh ../STS2-ShunMod.zip | awk '{print $5}')"

