name: CI Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── 先构建 Core（其他模块依赖 Core） ────────────────────────────────────
  build-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 9.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Download game references
        run: |
          mkdir -p deps
          DEPS_URL="https://github.com/${{ github.repository }}/releases/download/0.107.1"
          curl -sL "${DEPS_URL}/sts2.dll" -o deps/sts2.dll
          curl -sL "${DEPS_URL}/0Harmony.dll" -o deps/0Harmony.dll
          ls -la deps/

      - name: Check deps
        run: |
          if [ ! -f deps/sts2.dll ]; then
            echo ""
            echo "=============================================="
            echo "  sts2.dll not found in 0.107.1 release!"
            echo "  Upload with: gh release upload 0.107.1 sts2.dll 0Harmony.dll"
            echo "=============================================="
            exit 1
          fi

      - name: Restore
        run: dotnet restore STS2_ShunMod.sln

      - name: Build Core
        run: |
          dotnet build ShunMod.Core/ShunMod.Core.csproj \
            -c Release \
            -p:Sts2DataDir="$(realpath deps)" \
            --no-restore

      - name: Upload Core artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-core
          path: |
            ShunMod.Core/.godot/mono/temp/bin/Release/ShunMod_Core.dll
            ShunMod.Core/ShunMod_Core.json
          retention-days: 1

  # ── 剩余模块并行构建 ────────────────────────────────────────────────────
  build-modules:
    needs: build-core
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module:
          - name: Shun
            proj: ShunMod.Shun/ShunMod.Shun.csproj
            dir: ShunMod.Shun
            asm: ShunMod_Shun
            has_pck: true
          - name: Tweaks
            proj: ShunMod.Tweaks/ShunMod.Tweaks.csproj
            dir: ShunMod.Tweaks
            asm: ShunMod_Tweaks
            has_pck: false
          - name: Compat
            proj: ShunMod.Compat/ShunMod.Compat.csproj
            dir: ShunMod.Compat
            asm: ShunMod_Compat
            has_pck: false
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 9.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Download game references
        run: |
          mkdir -p deps
          DEPS_URL="https://github.com/${{ github.repository }}/releases/download/0.107.1"
          curl -sL "${DEPS_URL}/sts2.dll" -o deps/sts2.dll
          curl -sL "${DEPS_URL}/0Harmony.dll" -o deps/0Harmony.dll
          ls -la deps/

      - name: Download Core artifact
        uses: actions/download-artifact@v4
        with:
          name: build-core
          path: build-core/

      - name: Place Core.dll for project reference
        run: |
          mkdir -p "${{ matrix.module.dir }}/.godot/mono/temp/bin/Release"
          cp build-core/ShunMod_Core.dll "${{ matrix.module.dir }}/.godot/mono/temp/bin/Release/"
          cp build-core/ShunMod_Core.json "${{ matrix.module.dir }}/.godot/mono/temp/bin/Release/"

      - name: Build ${{ matrix.module.name }}
        run: |
          dotnet build ${{ matrix.module.proj }} \
            -c Release \
            -p:Sts2DataDir="$(realpath deps)" \
            --no-restore

      - name: Upload ${{ matrix.module.name }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.module.name }}
          path: |
            ${{ matrix.module.dir }}/.godot/mono/temp/bin/Release/${{ matrix.module.asm }}.dll
            ${{ matrix.module.dir }}/${{ matrix.module.asm }}.json
          retention-days: 1

  # ── 汇总打包 ────────────────────────────────────────────────────────────
  package:
    needs: build-modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: build-*
          merge-multiple: true

      - name: Download Godot for .pck export
        run: |
          echo "=== Downloading Godot 4.5.1 Mono ==="
          GODOT_URL="https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_mono_linux_x86_64.zip"
          curl -sL "$GODOT_URL" -o godot.zip || { echo "Download failed"; exit 0; }
          unzip -q godot.zip -d godot 2>/dev/null
          GODOT=$(find godot -name "Godot*" -type f -executable | head -1)
          [ -z "$GODOT" ] && { echo "Godot not found"; exit 0; }
          chmod +x "$GODOT"
          echo "=== Exporting .pck ==="
          "$GODOT" --headless --export-pack "BasicExport" ShunMod_Shun.pck
          ls -la ShunMod_Shun.pck 2>/dev/null || echo "Export failed"

      - name: Package individual zips
        run: |
          for entry in "Core|ShunMod_Core" "Shun|ShunMod_Shun" "Tweaks|ShunMod_Tweaks" "Compat|ShunMod_Compat"; do
            NAME="${entry%%|*}"
            ASM="${entry##*|}"
            echo "=== Packaging ${ASM} ==="
            mkdir -p "publish/${ASM}"
            cp "${ASM}.dll" "publish/${ASM}/" 2>/dev/null || echo "  No dll found for ${ASM}"
            cp "${ASM}.json" "publish/${ASM}/" 2>/dev/null || echo "  No json found for ${ASM}"
            # Shun 项目有 pck
            PCK=$(find . -maxdepth 1 -name "ShunMod_Shun.pck" -type f 2>/dev/null | head -1)
            if [ -n "$PCK" ] && [ "$ASM" = "ShunMod_Shun" ]; then
              cp "$PCK" "publish/${ASM}/"
            fi
            ls -la "publish/${ASM}/"
            cd publish && zip -r "../${ASM}.zip" "${ASM}/" && cd ..
            echo "  Packaged: $(ls -lh ${ASM}.zip | awk '{print $5}')"
          done

      - name: Package full zip
        run: |
          mkdir -p publish
          for asm in ShunMod_Core ShunMod_Shun ShunMod_Tweaks ShunMod_Compat; do
            mkdir -p "publish/${asm}"
            cp "${asm}.dll" "publish/${asm}/" 2>/dev/null || true
            cp "${asm}.json" "publish/${asm}/" 2>/dev/null || true
          done
          PCK=$(find . -maxdepth 1 -name "ShunMod_Shun.pck" -type f 2>/dev/null | head -1)
          if [ -n "$PCK" ]; then
            cp "$PCK" "publish/ShunMod_Shun/"
          fi
          ls -la publish/
          cd publish && zip -r "../STS2_ShunMod.zip" . && cd ..
          echo "  Packaged: $(ls -lh STS2_ShunMod.zip | awk '{print $5}')"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ShunMod-Build
          path: |
            ShunMod_Core.zip
            ShunMod_Shun.zip
            ShunMod_Tweaks.zip
            ShunMod_Compat.zip
            STS2_ShunMod.zip
          if-no-files-found: error