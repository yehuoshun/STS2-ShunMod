name: CI Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Download game references
        run: |
          mkdir -p deps
          DEPS_URL="https://github.com/${{ github.repository }}/releases/download/0.107.1"
          curl -sL "${DEPS_URL}/sts2.dll" -o deps/sts2.dll
          curl -sL "${DEPS_URL}/0Harmony.dll" -o deps/0Harmony.dll
          ls -la deps/

      - name: Check deps
        run: |
          if [ ! -f deps/sts2.dll ]; then
            echo ""
            echo "=============================================="
            echo "  sts2.dll not found in 0.107.1 release!"
            echo "  Upload with: gh release upload 0.107.1 sts2.dll 0Harmony.dll"
            echo "=============================================="
            exit 1
          fi

      - name: Restore
        run: dotnet restore STS2-ShunMod.sln

      - name: Build all projects
        run: dotnet build STS2-ShunMod.sln -c Release -p:Sts2DataDir="$(realpath deps)" --no-restore

      - name: Package individual zips
        run: |
          for entry in "Core|ShunMod.Core" "Shun|ShunMod.Shun" "Tweaks|ShunMod.Tweaks" "Compat|ShunMod.Compat"; do
            PROJ="${entry%%|*}"
            DIR="${entry##*|}"
            ASM="ShunMod_${PROJ}"
            PROJ_BUILD="${DIR}/.godot/mono/temp/bin/Release"
            echo "=== Packaging ${ASM} ==="
            mkdir -p "publish/${ASM}"
            cp "$PROJ_BUILD/${ASM}.dll" "publish/${ASM}/"
            cp "${DIR}/${ASM}.json" "publish/${ASM}/"
            # Shun 项目有 pck
            PCK=$(find "$PROJ_BUILD" -name "${ASM}.pck" -type f 2>/dev/null | head -1)
            if [ -z "$PCK" ]; then
              PCK=$(find . -maxdepth 1 -name "${ASM}.pck" -type f 2>/dev/null | head -1)
            fi
            if [ -n "$PCK" ]; then
              cp "$PCK" "publish/${ASM}/"
            fi
            ls -la "publish/${ASM}/"
            cd publish && zip -r "../${ASM}.zip" "${ASM}/" && cd ..
            echo "  Packaged: $(ls -lh ${ASM}.zip | awk '{print $5}')"
          done

      - name: Package full zip
        run: |
          mkdir -p publish
          for entry in "Core|ShunMod.Core" "Shun|ShunMod.Shun" "Tweaks|ShunMod.Tweaks" "Compat|ShunMod.Compat"; do
            PROJ="${entry%%|*}"
            DIR="${entry##*|}"
            ASM="ShunMod_${PROJ}"
            mkdir -p "publish/${ASM}"
            cp "${DIR}/.godot/mono/temp/bin/Release/${ASM}.dll" "publish/${ASM}/"
            cp "${DIR}/${ASM}.json" "publish/${ASM}/"
          done
          # Shun 的 pck
          PCK=$(find "ShunMod.Shun/.godot/mono/temp/bin/Release" -name "ShunMod_Shun.pck" -type f 2>/dev/null | head -1)
          if [ -z "$PCK" ]; then
            PCK=$(find . -maxdepth 1 -name "ShunMod_Shun.pck" -type f 2>/dev/null | head -1)
          fi
          if [ -n "$PCK" ]; then
            cp "$PCK" "publish/ShunMod_Shun/"
          fi
          ls -la publish/
          cd publish && zip -r "../STS2_ShunMod.zip" . && cd ..
          echo "  Packaged: $(ls -lh STS2_ShunMod.zip | awk '{print $5}')"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ShunMod-Build
          path: |
            ShunMod_Core.zip
            ShunMod_Shun.zip
            ShunMod_Tweaks.zip
            ShunMod_Compat.zip
            STS2_ShunMod.zip
          if-no-files-found: error