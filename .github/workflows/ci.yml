name: CI Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Download game references
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p deps
          gh release download deps \
            --dir deps \
            --pattern "*.dll" \
            --repo "${{ github.repository }}" \
            --clobber 2>/dev/null

      - name: Check deps
        run: |
          if [ ! -f deps/sts2.dll ]; then
            echo ""
            echo "=============================================="
            echo "  deps release 不存在或缺少 sts2.dll！"
            echo "  请上传游戏 DLL 到 deps release："
            echo "    gh release create deps --title deps sts2.dll 0Harmony.dll"
            echo "=============================================="
            exit 1
          fi

      - name: Restore
        run: dotnet restore STS2_ShunMod.csproj

      - name: Build DLL
        run: dotnet build STS2_ShunMod.csproj -c Release -p:Sts2DataDir="$(realpath deps)" --no-restore

      - name: Export .pck
        run: |
          echo "=== 下载 Godot 4.5.1 Mono ==="
          GODOT_URL="https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_mono_linux_x86_64.zip"
          curl -sL "$GODOT_URL" -o godot.zip || { echo "❌ 下载失败"; exit 0; }
          unzip -q godot.zip -d godot 2>/dev/null
          GODOT=$(find godot -name "Godot*" -type f -executable | head -1)
          [ -z "$GODOT" ] && { echo "❌ 未找到 Godot"; exit 0; }
          chmod +x "$GODOT"
          echo "=== 导出 .pck ==="
          "$GODOT" --headless --export-pack "BasicExport" STS2-ShunMod.pck
          ls -la STS2-ShunMod.pck 2>/dev/null || echo "⚠️ 导出失败"

      - name: Package
        run: |
          # Godot 导出会 rebuild DLL，输出到 .godot/mono/temp/bin/ 下
          # 优先找 Release，找不到搜 ExportRelease/ExportDebug
          DLL=$(find .godot/mono/temp/bin -name "STS2ShunMod.dll" -type f 2>/dev/null | head -1)
          if [ -z "$DLL" ]; then
            echo "❌ 找不到 DLL"
            find . -name "*.dll" -type f 2>/dev/null || true
            exit 1
          fi
          echo "DLL: $DLL"
          mkdir -p publish
          cp "$DLL" publish/
          cp STS2_ShunMod.json publish/
          PCK=$(find . -maxdepth 1 -name "STS2-ShunMod.pck" -type f 2>/dev/null | head -1)
          if [ -n "$PCK" ]; then
            cp "$PCK" publish/
          else
            echo "⚠️ 无 .pck"
          fi
          ls -la publish/
          cd publish && zip -r ../STS2-ShunMod.zip .
          echo "✅ 打包完成: $(ls -lh ../STS2-ShunMod.zip | awk '{print $5}')"

