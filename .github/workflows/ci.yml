name: CI Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Download game references
        run: |
          mkdir -p deps
          DEPS_URL="https://github.com/${{ github.repository }}/releases/download/0.107.1"
          curl -sL "${DEPS_URL}/sts2.dll" -o deps/sts2.dll
          curl -sL "${DEPS_URL}/0Harmony.dll" -o deps/0Harmony.dll
          ls -la deps/

      - name: Check deps
        run: |
          if [ ! -f deps/sts2.dll ]; then
            echo ""
            echo "=============================================="
            echo "  sts2.dll not found in 0.107.1 release!"
            echo "  Upload with: gh release upload 0.107.1 sts2.dll 0Harmony.dll"
            echo "=============================================="
            exit 1
          fi

      - name: Restore
        run: dotnet restore STS2_ShunMod.csproj

      - name: Build DLL
        run: dotnet build STS2_ShunMod.csproj -c Release -p:Sts2DataDir="$(realpath deps)" --no-restore

      - name: Export .pck
        run: |
          echo "=== Downloading Godot 4.5.1 Mono ==="
          GODOT_URL="https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_mono_linux_x86_64.zip"
          curl -sL "$GODOT_URL" -o godot.zip || { echo "Download failed"; exit 0; }
          unzip -q godot.zip -d godot 2>/dev/null
          GODOT=$(find godot -name "Godot*" -type f -executable | head -1)
          [ -z "$GODOT" ] && { echo "Godot not found"; exit 0; }
          chmod +x "$GODOT"
          echo "=== Exporting .pck ==="
          "$GODOT" --headless --export-pack "BasicExport" STS2_ShunMod.pck
          ls -la STS2_ShunMod.pck 2>/dev/null || echo "Export failed"

      - name: Package
        run: |
          DLL=$(find .godot/mono/temp/bin -name "STS2_ShunMod.dll" -type f 2>/dev/null | head -1)
          if [ -z "$DLL" ]; then
            echo "DLL not found"
            find . -name "*.dll" -type f 2>/dev/null || true
            exit 1
          fi
          echo "DLL: $DLL"
          mkdir -p publish
          cp "$DLL" publish/
          cp STS2_ShunMod.json publish/
          PCK=$(find . -maxdepth 1 -name "STS2_ShunMod.pck" -type f 2>/dev/null | head -1)
          if [ -n "$PCK" ]; then
            cp "$PCK" publish/
          else
            echo "No .pck"
          fi
          ls -la publish/
          cd publish && zip -r ../STS2_ShunMod.zip .
          echo "Packaged: $(ls -lh ../STS2_ShunMod.zip | awk '{print $5}')"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: STS2_ShunMod
          path: STS2_ShunMod.zip
          if-no-files-found: error
