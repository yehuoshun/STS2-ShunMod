name: CI Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Download game references
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p deps
          gh release download deps \
            --dir deps \
            --pattern "*.dll" \
            --repo "${{ github.repository }}" \
            --clobber 2>/dev/null || \
            echo "⚠️ 缺少游戏 DLL，CI 跳过编译验证"

      - name: Restore
        run: dotnet restore STS2-ShunMod.csproj

      - name: Build
        if: hashFiles('deps/sts2.dll') != ''
        run: dotnet build STS2-ShunMod.csproj -c Release -p:Sts2DataDir="$(realpath deps)" --no-restore

  auto-tag:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto bump and tag
        run: |
          MSG=$(git log -1 --pretty=%B)
          case "$MSG" in
            *"[skip ci]"*) echo "skip ci commit, exiting"; exit 0 ;;
          esac

          VERSION=$(python3 -c "import json; print(json.load(open('STS2-ShunMod.json'))['version'])")
          LATEST_TAG=$(git tag --sort=-v:refname | head -1)

          if [ -z "$LATEST_TAG" ]; then
            echo "first tag: $VERSION"
            git tag "$VERSION"
            git push origin "$VERSION"
            exit 0
          fi

          if [ "$LATEST_TAG" != "$VERSION" ]; then
            echo "sync: json=$VERSION => tag=$LATEST_TAG"
            python3 -c "
import json
d = json.load(open('STS2-ShunMod.json'))
d['version'] = '$LATEST_TAG'
json.dump(d, open('STS2-ShunMod.json', 'w'), indent=2, ensure_ascii=False)
"
            VERSION="$LATEST_TAG"
          fi

          V_NUM="${VERSION#v}"
          MAJOR=$(echo "$V_NUM" | cut -d. -f1)
          MINOR=$(echo "$V_NUM" | cut -d. -f2)
          PATCH=$(echo "$V_NUM" | cut -d. -f3)
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="v${MAJOR}.${MINOR}.${NEW_PATCH}"
          echo "bump: $VERSION => $NEW_VERSION"

          python3 -c "
import json
d = json.load(open('STS2-ShunMod.json'))
d['version'] = '$NEW_VERSION'
json.dump(d, open('STS2-ShunMod.json', 'w'), indent=2, ensure_ascii=False)
"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add STS2-ShunMod.json
          git commit -m "chore: bump $VERSION => $NEW_VERSION [skip ci]"
          git tag "$NEW_VERSION"
          git push origin main --tags
          echo "Triggering release workflow for $NEW_VERSION..."
          gh workflow run release.yml -f version="$NEW_VERSION"
