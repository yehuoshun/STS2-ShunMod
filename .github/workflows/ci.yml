name: CI Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Download game references
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p deps
          gh release download deps \
            --dir deps \
            --pattern "*.dll" \
            --repo "${{ github.repository }}" \
            --clobber 2>/dev/null || printf '%s\n' "⚠️ 缺少游戏 DLL，CI 跳过编译验证"

      - name: Restore
        run: dotnet restore STS2-ShunMod.csproj

      - name: Build
        if: hashFiles('deps/sts2.dll') != ''
        run: dotnet build STS2-ShunMod.csproj -c Release -p:Sts2DataDir="$(realpath deps)" --no-restore

      - name: Package ZIP
        if: hashFiles('deps/sts2.dll') != ''
        run: |
          BUILD_DIR=.godot/mono/temp/bin/Release
          mkdir -p publish
          cp "$BUILD_DIR/STS2-ShunMod.dll" publish/ 2>/dev/null || \
            cp "$BUILD_DIR/net9.0/STS2-ShunMod.dll" publish/ 2>/dev/null || \
            cp "bin/Release/net9.0/STS2-ShunMod.dll" publish/
          cp STS2-ShunMod.json publish/
          if [ -d STS2-ShunMod/localization ]; then
            mkdir -p publish/STS2-ShunMod/localization
            cp -r STS2-ShunMod/localization/* publish/STS2-ShunMod/localization/
          fi
          if [ -d STS2-ShunMod/images ]; then
            mkdir -p publish/STS2-ShunMod/images
            cp -r STS2-ShunMod/images/* publish/STS2-ShunMod/images/
          fi
          cd publish && zip -r ../STS2-ShunMod.zip .
          echo "✅ ZIP: $(ls -la ../STS2-ShunMod.zip | awk '{print $5}') bytes"

      - name: Upload artifact
        if: hashFiles('deps/sts2.dll') != ''
        uses: actions/upload-artifact@v4
        with:
          name: STS2-ShunMod
          path: STS2-ShunMod.zip
          retention-days: 30
