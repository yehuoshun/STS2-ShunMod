name: CI Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version (push only)
        if: github.event_name == 'push'
        run: |
          python3 << 'PYEOF'
          import json, subprocess

          result = subprocess.run(
              ['git', 'diff', '--name-only', 'HEAD~1', 'HEAD'],
              capture_output=True, text=True
          )
          changed = result.stdout.splitlines()
          print('Changed files:', changed)

          modules = {
              'ShunMod.Core':   'ShunMod.Core/ShunMod_Core.json',
              'ShunMod.Shun':   'ShunMod.Shun/ShunMod_Shun.json',
              'ShunMod.Tweaks': 'ShunMod.Tweaks/ShunMod_Tweaks.json',
              'ShunMod.Compat': 'ShunMod.Compat/ShunMod_Compat.json',
          }

          touched = set()
          for f in changed:
              for mod, json_path in modules.items():
                  if f.startswith(mod + '/'):
                      touched.add(mod)

          if not touched:
              print('No module code changed, skip bump')
              exit(0)

          print('Touched modules:', touched)

          for mod, json_path in modules.items():
              if mod not in touched:
                  continue
              d = json.load(open(json_path))
              cur = d['version']
              maj, min, pat = cur.lstrip('v').split('.')
              new = 'v' + maj + '.' + min + '.' + str(int(pat) + 1)
              d['version'] = new
              json.dump(d, open(json_path, 'w'), indent=2, ensure_ascii=False)
              print(f'  {mod}: {cur} -> {new}')
          PYEOF
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ShunMod.*/ShunMod_*.json
          git diff --staged --quiet || (git commit -m "chore: bump versions [skip ci]" && git push) || echo "Nothing to bump"

      - name: Setup .NET 9.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Download game references
        run: |
          mkdir -p deps
          DEPS_URL="https://github.com/${{ github.repository }}/releases/download/0.107.1"
          curl -sL "${DEPS_URL}/sts2.dll" -o deps/sts2.dll
          curl -sL "${DEPS_URL}/0Harmony.dll" -o deps/0Harmony.dll
          ls -la deps/

      - name: Check deps
        run: |
          if [ ! -f deps/sts2.dll ]; then
            echo ""
            echo "=============================================="
            echo "  sts2.dll not found in 0.107.1 release!"
            echo "  Upload with: gh release upload 0.107.1 sts2.dll 0Harmony.dll"
            echo "=============================================="
            exit 1
          fi

      - name: Restore
        run: dotnet restore STS2_ShunMod.sln

      - name: Build all projects
        run: dotnet build STS2_ShunMod.sln -c Release -p:Sts2DataDir="$(realpath deps)" --no-restore

      - name: Export .pck (Shun only)
        run: |
          echo "=== Downloading Godot 4.5.1 Mono ==="
          GODOT_URL="https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_mono_linux_x86_64.zip"
          curl -sL "$GODOT_URL" -o godot.zip || { echo "Download failed"; exit 0; }
          unzip -q godot.zip -d godot 2>/dev/null
          GODOT=$(find godot -name "Godot*" -type f -executable | head -1)
          [ -z "$GODOT" ] && { echo "Godot not found"; exit 0; }
          chmod +x "$GODOT"
          echo "=== Exporting .pck ==="
          "$GODOT" --headless --export-pack "BasicExport" ShunMod_Shun.pck
          ls -la ShunMod_Shun.pck 2>/dev/null || echo "Export failed"

      - name: Package individual zips
        run: |
          for entry in "Core|ShunMod.Core" "Shun|ShunMod.Shun" "Tweaks|ShunMod.Tweaks" "Compat|ShunMod.Compat"; do
            PROJ="${entry%%|*}"
            DIR="${entry##*|}"
            ASM="ShunMod_${PROJ}"
            PROJ_BUILD="${DIR}/.godot/mono/temp/bin/Release"
            echo "=== Packaging ${ASM} ==="
            mkdir -p "publish/${ASM}"
            cp "$PROJ_BUILD/${ASM}.dll" "publish/${ASM}/"
            cp "${DIR}/${ASM}.json" "publish/${ASM}/"
            # Shun 项目有 pck
            PCK=$(find "$PROJ_BUILD" -name "${ASM}.pck" -type f 2>/dev/null | head -1)
            if [ -z "$PCK" ]; then
              PCK=$(find . -maxdepth 1 -name "${ASM}.pck" -type f 2>/dev/null | head -1)
            fi
            if [ -n "$PCK" ]; then
              cp "$PCK" "publish/${ASM}/"
            fi
            ls -la "publish/${ASM}/"
            cd publish && zip -r "../${ASM}.zip" "${ASM}/" && cd ..
            echo "  Packaged: $(ls -lh ${ASM}.zip | awk '{print $5}')"
          done

      - name: Package full zip
        run: |
          mkdir -p publish
          for entry in "Core|ShunMod.Core" "Shun|ShunMod.Shun" "Tweaks|ShunMod.Tweaks" "Compat|ShunMod.Compat"; do
            PROJ="${entry%%|*}"
            DIR="${entry##*|}"
            ASM="ShunMod_${PROJ}"
            mkdir -p "publish/${ASM}"
            cp "${DIR}/.godot/mono/temp/bin/Release/${ASM}.dll" "publish/${ASM}/"
            cp "${DIR}/${ASM}.json" "publish/${ASM}/"
          done
          # Shun 的 pck
          PCK=$(find "ShunMod.Shun/.godot/mono/temp/bin/Release" -name "ShunMod_Shun.pck" -type f 2>/dev/null | head -1)
          if [ -z "$PCK" ]; then
            PCK=$(find . -maxdepth 1 -name "ShunMod_Shun.pck" -type f 2>/dev/null | head -1)
          fi
          if [ -n "$PCK" ]; then
            cp "$PCK" "publish/ShunMod_Shun/"
          fi
          ls -la publish/
          cd publish && zip -r "../STS2_ShunMod.zip" . && cd ..
          echo "  Packaged: $(ls -lh STS2_ShunMod.zip | awk '{print $5}')"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ShunMod-Build
          path: |
            ShunMod_Core.zip
            ShunMod_Shun.zip
            ShunMod_Tweaks.zip
            ShunMod_Compat.zip
            STS2_ShunMod.zip
          if-no-files-found: error